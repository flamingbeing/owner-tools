# The merge checklist from AGENTS.md, run on every PR (and on main): the repo check (with the Worker tests), the
# proof-read, and the browser test of Ask Claude.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo check
        run: node tools/check.mjs
      - name: Unit tests
        run: for f in worker/test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done
      - name: Proof-read (pages and documents)
        run: node tools/proofread.mjs

  browser:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium for 26.04 (ubuntu-latest)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install -g playwright@1.56.1
      - name: Cache the browser
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-ubuntu-24.04
      - name: Install a browser
        run: |
          playwright install chromium
      - name: Ask Claude
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs"
          node ask/test/e2e.mjs
