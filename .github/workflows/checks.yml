# The merge checklist from AGENTS.md, run on every PR (and on main): the repo check (with the Worker tests), the
# proof-read, and the browser test of Ask Claude.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
      - name: Repo check
        run: node tools/check.mjs
      - name: Unit tests
        run: for f in worker/test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done
      - name: Proof-read (pages and documents)
        run: node tools/proofread.mjs

  browser:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium for 26.04 (ubuntu-24.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
      - name: Install Playwright
        run: npm install -g playwright@1.56.1
      - uses: flamingbeing/app-devkit/setup-browser@v1
        with:
          playwright-version: '1.56.1'
          devkit-dir: ''
      - name: Ask Claude
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs"
          node ask/test/e2e.mjs
